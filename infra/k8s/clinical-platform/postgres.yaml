# DEMO ONLY: single in-cluster PostgreSQL on ephemeral storage (data is lost when the pod restarts).
# Replace with RDS before holding any data you need to keep. One database and role per service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: clinical-platform
data:
  01-service-databases.sh: |
    #!/bin/sh
    set -e
    for s in identity patient provider facility scheduling appointment; do
      pw=$(printenv "$(echo "$s" | tr a-z A-Z)_DB_PASSWORD")
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -v pw="$pw" <<SQL
    CREATE ROLE ${s}_user LOGIN PASSWORD :'pw';
    CREATE DATABASE ${s} OWNER ${s}_user;
    SQL
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: clinical-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: clinical-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: clinical-platform
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: public.ecr.aws/docker/library/postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: clinical-platform-db, key: POSTGRES_PASSWORD}}
            - name: IDENTITY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: clinical-platform-db, key: identity-password}}
            - name: PATIENT_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: clinical-platform-db, key: patient-password}}
            - name: PROVIDER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: clinical-platform-db, key: provider-password}}
            - name: FACILITY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: clinical-platform-db, key: facility-password}}
            - name: SCHEDULING_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: clinical-platform-db, key: scheduling-password}}
            - name: APPOINTMENT_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: clinical-platform-db, key: appointment-password}}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: clinical-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
