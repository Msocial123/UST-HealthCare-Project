apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-service
  namespace: clinical-platform
  labels:
    app.kubernetes.io/name: scheduling-service
    app.kubernetes.io/part-of: clinical-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduling-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduling-service
        app.kubernetes.io/part-of: clinical-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: IMAGE_REGISTRY/clinical-platform/scheduling-service:IMAGE_TAG
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clinical-platform-db
                  key: scheduling-database-url
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: scheduling-service
          image: IMAGE_REGISTRY/clinical-platform/scheduling-service:IMAGE_TAG
          ports:
            - name: http
              containerPort: 8005
          envFrom:
            - configMapRef:
                name: clinical-platform-config
          env:
            - name: PORT
              value: "8005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clinical-platform-db
                  key: scheduling-database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clinical-platform-jwt
                  key: JWT_SECRET_KEY
            - name: FACILITY_SERVICE_URL
              value: "http://facility-service:8004"
            - name: FACILITY_TIMEOUT_SECONDS
              value: "3"
            - name: EXTRA_HOURS_SLOT_MINUTES
              value: "15"
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scheduling-service
  namespace: clinical-platform
  labels:
    app.kubernetes.io/name: scheduling-service
    app.kubernetes.io/part-of: clinical-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scheduling-service
  ports:
    - name: http
      port: 8005
      targetPort: http
