# CP3 — CI gate (docs/workflow/governed-sdlc.md).
# Independently re-runs every service's lint, tests (SQLite and PostgreSQL) and Alembic round trip
# on a clean machine, plus a repository secret scan. Uses synthetic, CI-only values; no real secrets.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - patient-service
          - provider-service
          - facility-service
          - scheduling-service
          - appointment-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Separate databases: the Alembic round trip leaves `alembic_version` behind, and the test suites
      # expect a disposable database of their own (they drop and recreate tables, and some run migrations).
      PG_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci
      PG_TEST_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests (SQLite)
        run: pytest

      - name: Alembic round trip (upgrade, downgrade, upgrade, check)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Create test database
        run: >-
          python -c "import psycopg;
          c = psycopg.connect('postgresql://ci:ci-only-password@localhost:5432/ci', autocommit=True);
          c.execute('CREATE DATABASE ci_test'); c.close()"

      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: ${{ env.PG_TEST_URL }}
        run: pytest

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
