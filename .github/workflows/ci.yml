# CP3 — CI gate (docs/workflow/governed-sdlc.md).
# Independently re-runs every service's lint, tests (SQLite and PostgreSQL) and Alembic round trip
# on a clean machine, a SonarCloud code-quality gate per service, plus a repository secret scan.
# Uses synthetic, CI-only values; the only real credential is the SONAR_TOKEN repository secret.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - patient-service
          - provider-service
          - facility-service
          - scheduling-service
          - appointment-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Separate databases: the Alembic round trip leaves `alembic_version` behind, and the test suites
      # expect a disposable database of their own (they drop and recreate tables, and some run migrations).
      PG_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci
      PG_TEST_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can attribute issues and detect new code.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests (SQLite)
        run: pytest

      - name: Alembic round trip (upgrade, downgrade, upgrade, check)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Create test database
        run: >-
          python -c "import psycopg;
          c = psycopg.connect('postgresql://ci:ci-only-password@localhost:5432/ci', autocommit=True);
          c.execute('CREATE DATABASE ci_test'); c.close()"

      - name: Tests (PostgreSQL) with coverage
        env:
          TEST_DATABASE_URL: ${{ env.PG_TEST_URL }}
        run: pytest --cov=app --cov-report=xml:coverage.xml

      # SonarCloud: repository secret SONAR_TOKEN; organization from variable SONAR_ORGANIZATION (default devin-test).
      # Project key per service: <SONAR_ORGANIZATION>_<service>. See docs/workflow/sonarcloud.md.
      - name: Check SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'devin-test' }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::SonarCloud is not configured: set the SONAR_TOKEN secret and SONAR_ORGANIZATION variable"
            exit 1
          fi

      - name: SonarCloud scan and Quality Gate
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: services/${{ matrix.service }}
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'devin-test' }}
            -Dsonar.projectKey=${{ vars.SONAR_ORGANIZATION || 'devin-test' }}_${{ matrix.service }}
            -Dsonar.projectName=${{ matrix.service }}
            -Dsonar.sources=app,migrations
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=migrations/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: SonarCloud findings gate (vulnerabilities, hotspots, critical/blocker code smells)
        if: ${{ !cancelled() && (steps.sonar.outcome == 'success' || steps.sonar.outcome == 'failure') }}
        working-directory: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_ORGANIZATION || 'devin-test' }}_${{ matrix.service }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_BRANCH: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python .github/scripts/sonar_findings_gate.py

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
