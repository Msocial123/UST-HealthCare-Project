apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.name }}
    kind: SecretStore
  target:
    name: {{ .Values.targetSecret }}
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ required "apiKeySecret is required" .Values.apiKeySecret }}
        property: api_key
    - secretKey: token
      remoteRef:
        key: {{ required "clusterAgentTokenSecret is required" .Values.clusterAgentTokenSecret }}
        property: token
