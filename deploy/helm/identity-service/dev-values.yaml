# dev environment overrides for identity-service.
# Rollout: change image.tag (CI does this on every merge to main). Rollback: git revert the commit that changed it.
# Argo CD syncs the change automatically.
image:
  repository: 165742853391.dkr.ecr.us-east-1.amazonaws.com/smart-hospital/identity-service
  tag: "5f077cdb0217"

replicaCount: 1

serviceAccount:
  roleArn: arn:aws:iam::165742853391:role/smart-hospital-dev-identity-service

secrets:
  database: smart-hospital/dev/identity-service/database
  jwt: smart-hospital/dev/shared/jwt-signing-key

extraEnv:
  APP_ENV: development
