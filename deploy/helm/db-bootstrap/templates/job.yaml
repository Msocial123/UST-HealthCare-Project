{{- /* Re-runs on every Argo CD sync; every statement is idempotent. Never drops anything. */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: smart-hospital
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ .Values.image }}
          envFrom:
            - secretRef:
                name: {{ .Values.name }}
          env:
            - name: SERVICES
              value: {{ keys .Values.services | sortAlpha | join " " | replace "-" "_" | upper | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for svc in $SERVICES; do
                eval "host=\${${svc}_HOST} port=\${${svc}_PORT} db=\${${svc}_DBNAME} user=\${${svc}_USERNAME} pw=\${${svc}_PASSWORD}"
                echo "Ensuring role and database for ${svc}"
                PGPASSWORD="$MASTER_PASSWORD" psql "host=$host port=$port dbname=postgres user=$MASTER_USER sslmode=require" \
                  -v ON_ERROR_STOP=1 -q -v db="$db" -v usr="$user" -v pw="$pw" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'usr') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'usr') \gexec
              ALTER ROLE :"usr" WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'pw';
              SELECT format('GRANT %I TO CURRENT_USER', :'usr') WHERE NOT pg_has_role(CURRENT_USER, :'usr', 'MEMBER') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'usr') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db') \gexec
              ALTER DATABASE :"db" OWNER TO :"usr";
              REVOKE ALL ON DATABASE :"db" FROM PUBLIC;
              SQL
              done
              echo "Done"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
