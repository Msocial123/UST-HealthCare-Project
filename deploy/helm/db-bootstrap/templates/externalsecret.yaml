apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.name }}
    kind: SecretStore
  target:
    name: {{ .Values.name }}
    creationPolicy: Owner
  data:
    - secretKey: MASTER_USER
      remoteRef:
        key: {{ required "masterSecret is required" .Values.masterSecret }}
        property: username
    - secretKey: MASTER_PASSWORD
      remoteRef:
        key: {{ .Values.masterSecret }}
        property: password
    {{- range $svc, $secret := .Values.services }}
    {{- $p := $svc | replace "-" "_" | upper }}
    {{- range $field := list "host" "port" "dbname" "username" "password" }}
    - secretKey: {{ printf "%s_%s" $p ($field | upper) }}
      remoteRef:
        key: {{ $secret }}
        property: {{ $field }}
    {{- end }}
    {{- end }}
