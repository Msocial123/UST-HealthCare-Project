# Values for the argo/argo-cd Helm chart (installed by bootstrap.sh).
global:
  domain: argocd.local

configs:
  cm:
    # Poll Git every 3 minutes (with up to 30s jitter) so commits are picked up automatically.
    timeout.reconciliation: 180s
    timeout.reconciliation.jitter: 30s
  params:
    # TLS is terminated by the server itself (self-signed certificate); the load balancer passes TCP through.
    server.insecure: false

dex:
  enabled: false

notifications:
  enabled: false

server:
  service:
    # Public Classic Load Balancer (TCP passthrough) created by the EKS cloud provider in the public subnets.
    # Not NLB: this account is not allowed to create Network Load Balancers.
    type: LoadBalancer
