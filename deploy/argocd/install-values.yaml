# Values for the argo/argo-cd Helm chart (installed by bootstrap.sh).
global:
  domain: argocd.local

configs:
  cm:
    # Poll Git every 3 minutes (with up to 30s jitter) so commits are picked up automatically.
    timeout.reconciliation: 180s
    timeout.reconciliation.jitter: 30s
  params:
    # TLS is terminated by the server itself (self-signed certificate); the NLB passes TCP through.
    server.insecure: false

dex:
  enabled: false

notifications:
  enabled: false

server:
  service:
    # Public Network Load Balancer created by the EKS cloud provider in the public subnets.
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
